[package]
name = "shoes"
version = "0.3.1"
edition = "2024"
license = "MIT"
description = "A multi-protocol proxy server."
homepage = "https://github.com/cfal/shoes/"
repository = "https://github.com/cfal/shoes/"
readme = "README.md"
keywords = ["proxy", "proxy-server", "shadowsocks", "v2ray", "vmess"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "shoes"
# rlib = Rust library (for Rust dependencies)
# cdylib = C dynamic library (.so on Linux/Android, .dylib on macOS)
# staticlib = C static library (.a) - required for iOS
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "shoes"
path = "src/main.rs"

[[bin]]
name = "shoes-naiveproxy-e2e-client"
path = "src/bin/shoes-naiveproxy-e2e-client.rs"
required-features = ["e2e-client"]

[[bin]]
name = "shoes-basic-proxy-e2e-server"
path = "src/bin/shoes-basic-proxy-e2e-server.rs"
required-features = ["e2e-client"]

[[bin]]
name = "shoes-snell-e2e-server"
path = "src/bin/shoes-snell-e2e-server.rs"
required-features = ["e2e-client"]

[[bin]]
name = "shoes-shadowtls-e2e-server"
path = "src/bin/shoes-shadowtls-e2e-server.rs"
required-features = ["e2e-client"]

[[bin]]
name = "shoes-quic-e2e-server"
path = "src/bin/shoes-quic-e2e-server.rs"
required-features = ["e2e-client"]

[[bin]]
name = "shoes-ss-obfs-e2e-client"
path = "src/bin/shoes-ss-obfs-e2e-client.rs"
required-features = ["e2e-client"]

[[bin]]
name = "shoes-vless-xhttp-e2e-client"
path = "src/bin/shoes-vless-xhttp-e2e-client.rs"
required-features = ["e2e-client"]

[[bin]]
name = "shoes-basic-proxy-perf-client"
path = "src/bin/shoes-basic-proxy-perf-client.rs"
required-features = ["internal-bench"]

[[bin]]
name = "shoes-static-http-perf-server"
path = "src/bin/shoes-static-http-perf-server.rs"
required-features = ["internal-bench"]

[features]
default = []
e2e-client = ["dep:rustls-pemfile", "dep:tokio-rustls"]
ffi = []  # Enable FFI module for non-Android builds
internal-bench = []

[[bench]]
name = "perf_baseline"
harness = false
required-features = ["internal-bench"]

[dependencies]
async-trait = "*"
aes = "0.8.4"
aes-gcm = "*"
aws-lc-rs = { version = "*", default-features = false }
base64 = "*"
blake2 = "*"
blake3 = "*"
blowfish = "0.9.1"
bytes = "*"
cast5 = "0.11.1"
chrono = "*"
cipher = "0.4.4"
crc32fast = "1.5.0"
dashmap = "*"
des = "0.8.1"
digest = "0.11"
etherparse = "*"
futures = "*"
h2 = "*"
h3 = "*"
h3-quinn = "*"
hickory-resolver = { version = "*", default-features = false, features = ["tokio", "tls-aws-lc-rs", "https-aws-lc-rs", "h3-aws-lc-rs"] }
http = "*"
http-body-util = "*"
hyper = { version = "*", features = ["server", "http1", "http2"] }
hyper-util = { version = "*", features = ["tokio", "server"] }
indexmap = "*"
kcp = "0.6.0"
libc = "*"
log = { version = "*", features = ["std", "release_max_level_info"] }
lru = "0.18"
md-5 = "*"
memchr = "*"
mime_guess = "*"
notify = "*"
parking_lot = "0.12"
pbkdf2 = "0.13.0"
percent-encoding = "*"
quinn = { version = "*", default-features = false, features = ["log", "platform-verifier", "runtime-tokio", "rustls-aws-lc-rs"] }
rand = "*"
rand_core = "*"
rcgen = { version = "*", default-features = false, features = ["aws_lc_rs", "pem"] }
reed-solomon-erasure = "6.0.0"
regex = "*"
rust-argon2 = "*"
rustc-hash = "*"
rustls-pemfile = { version = "*", optional = true }
rustls = "*"
salsa20 = "0.10.2"
serde = { version = "*", features = ["derive", "std"] }
serde_json = "*"
serde_yaml = "*"
sha1 = "0.11.0"
snap = "1.1.2"
rmp-serde = "*"
reqwest = { version = "*", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
shake = "*"
smoltcp = { version = "*", default-features = false, features = ["std", "log", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-icmp", "socket-udp", "socket-tcp", "socket-tcp-cubic", "phy-tuntap_interface", "assembler-max-segment-count-32"] }
socket2 = "*"
subtle = "*"
twofish = "0.7.1"
tokio = { version = "*", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-rustls = { version = "*", optional = true }
tokio-util = { version = "*", features = ["time"] }
tun = { version = "*", features = ["async"] }
url = "*"
webpki-roots = { version = "*" }
x509-parser = { version = "*", default-features = false, features = ["verify-aws"] }

[dev-dependencies]
rcgen = { version = "*", default-features = false, features = ["aws_lc_rs", "pem"] }
serde_json = "*"
tempfile = "*"

# jemalloc for better memory performance (not supported on Windows MSVC, iOS, or Android)
[target.'cfg(not(any(target_env = "msvc", target_os = "ios", target_os = "android")))'.dependencies]
tikv-jemallocator = "*"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "*"
jni = "0.22"
ndk-sys = "*"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
