name: Build Binaries

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds (using cross for cross-compilation)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            binary_name: shoes
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            binary_name: shoes
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            binary_name: shoes
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            binary_name: shoes

          # Release artifacts are Linux-only; macOS/Windows builds are out of
          # scope for this node-server release surface.

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies
        if: matrix.use_cross == true
        run: |
          sudo apt-get update
          case "${{ matrix.target }}" in
            "aarch64-unknown-linux-gnu")
              sudo apt-get install -y gcc-aarch64-linux-gnu
              ;;
            "aarch64-unknown-linux-musl")
              sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
              ;;
            "x86_64-unknown-linux-musl")
              sudo apt-get install -y musl-tools
              ;;
          esac

      - name: Install cross-compilation tool
        if: matrix.use_cross == true
        run: |
          cargo install cross

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary (using cross)
        if: matrix.use_cross == true
        run: cross build --release --target ${{ matrix.target }}

      - name: Build binary (native)
        if: matrix.use_cross == false
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify binary exists
        run: |
          if [ -f "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" ]; then
            echo "Binary found: target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
            ls -la "target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
            
            # Show file type and architecture
            file "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" || true
            
            # Test the binary can be executed (for native builds only)
            if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]]; then
              echo "Testing binary execution..."
              "./target/${{ matrix.target }}/release/${{ matrix.binary_name }}" --help || echo "Binary test failed, but file exists"
            fi
          else
            echo "Binary not found!"
            echo "Contents of release directory:"
            ls -la "target/${{ matrix.target }}/release/" || echo "Release directory doesn't exist"
            exit 1
          fi

      - name: Prepare binary (Unix)
        if: "!contains(matrix.os, 'windows')"
        run: |
          mkdir -p artifacts
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "artifacts/${{ matrix.binary_name }}"
          
          # Strip the binary to reduce size
          if command -v strip &> /dev/null; then
            strip "artifacts/${{ matrix.binary_name }}" || echo "Strip failed, continuing..."
          fi
          
          # Create tarball
          cd artifacts
          tar -czf ${{ github.event.repository.name }}-${{ matrix.target }}.tar.gz "${{ matrix.binary_name }}"
          
          # Debug: show what files were created
          echo "Contents of artifacts directory:"
          ls -la
          
          # Verify the tarball was created
          if [ -f "${{ github.event.repository.name }}-${{ matrix.target }}.tar.gz" ]; then
            echo "Tarball created successfully: ${{ github.event.repository.name }}-${{ matrix.target }}.tar.gz"
          else
            echo "ERROR: Tarball was not created!"
            exit 1
          fi
          
          rm "${{ matrix.binary_name }}"

      - name: Prepare binary (Windows)
        if: contains(matrix.os, 'windows')
        shell: bash
        run: |
          mkdir -p artifacts
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "artifacts/${{ matrix.binary_name }}"
          cd artifacts
          7z a ${{ github.event.repository.name }}-${{ matrix.target }}.zip "${{ matrix.binary_name }}"

      - name: Verify artifacts before upload
        run: |
          echo "Checking for artifacts to upload..."
          ls -la artifacts/ || echo "artifacts directory not found"
          
          # Check for expected file patterns
          if ls artifacts/*.tar.gz 1> /dev/null 2>&1; then
            echo "Found .tar.gz files:"
            ls -la artifacts/*.tar.gz
          fi
          
          if ls artifacts/*.zip 1> /dev/null 2>&1; then
            echo "Found .zip files:"
            ls -la artifacts/*.zip
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.target }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.zip
          if-no-files-found: error

  docker:
    name: Build Docker Image (${{ matrix.platform }})
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          # Rust builds (aws-lc-rs, quinn, jemalloc) are too heavy to compile
          # reliably under QEMU emulation on shared runners; build arm64
          # natively on an arm64 runner instead.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR repository names must be lowercase; github.repository_owner keeps
      # the original case (e.g. Kingroyal78), so compute a lowercase registry
      # owner once and reuse it for all image tags.
      - name: Compute lowercase registry owner
        id: registry
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ steps.registry.outputs.owner }}/shoes:${{ github.ref_name }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}

  docker-manifest:
    name: Create Docker Manifest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Compute lowercase registry owner
        id: registry
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          REGISTRY="ghcr.io/${{ steps.registry.outputs.owner }}/shoes"
          VERSION="${{ github.ref_name }}"
          docker buildx imagetools create \
            -t "$REGISTRY:$VERSION" \
            -t "$REGISTRY:latest" \
            "$REGISTRY:$VERSION-amd64" \
            "$REGISTRY:$VERSION-arm64"
          docker buildx imagetools inspect "$REGISTRY:$VERSION"

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Download only the Linux tarballs. The artifact names are
      # <repo>-<target> (e.g. shoes-x86_64-unknown-linux-gnu); the pattern
      # excludes the internal dockerbuild artifacts (named
      # <owner>~<repo>~<hash>.dockerbuild) produced by build-push-action.
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ github.event.repository.name }}-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
